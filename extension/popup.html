<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Tove Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="send-box">
      <div class="send-row">
        <section id="select-placeholder" onclick="SelectChannelSwitch()">Carregando canais...</section>
        <button id="send" title="Enviar link da aba ativa">➤</button>
      </div>
      <div class="DropBoxClosed" id="select-channel">
        <section id="channel-options-box"></section>
      </div>
    </div>
    <div id="BtAction">
      <button id="mobile-qr" title="Conectar via QR Code / Rede">Pin</button>
      <button id="refresh" title="Atualizar">↻</button>
    </div>
  </header>

  <section id="connection" class="connection" hidden>Conectando ao Tove...</section>

  <main id="content">
    <!-- QR & Connection Modal Panel -->
    <section id="qr-panel" hidden style="padding: 12px; background: var(--color-overlay-white-medium); border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--color-overlay-white-border);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong style="font-size: 12px; color: var(--color-text-primary);">Conectar com PC ou Celular</strong>
        <button id="close-qr-btn" style="background: none; border: none; color: var(--color-text-secondary); cursor: pointer; font-size: 14px;">✕</button>
      </div>
      
      <div id="qr-img-container" style="text-align: center; margin-bottom: 8px;" hidden>
        <img id="qr-image" alt="QR Code de conexão" style="max-width: 180px; border-radius: 8px; background: var(--color-white); padding: 4px; display: inline-block;">
      </div>

      <div style="border-top: 1px solid var(--color-overlay-white-border); padding-top: 8px; margin-top: 8px;">
        <label style="font-size: 11px; color: var(--color-text-label); display: block; margin-bottom: 4px;">Cole a Chave / JSON de Sincronização do Tove:</label>
        <textarea id="qr-json-input" placeholder='{"url":"http://192.168.1.X:54321","token":"..."}' style="width: 100%; box-sizing: border-box; height: 50px; padding: 6px; font-size: 10px; border-radius: 6px; border: 1px solid var(--color-overlay-white-border); background: var(--color-overlay-black); color: var(--color-accent-cyan); resize: none; margin-bottom: 6px; font-family: monospace;"></textarea>
        <div style="display: flex; gap: 6px;">
          <button id="pair-json-btn" style="flex: 1; padding: 6px; font-size: 11px; font-weight: bold; background-color: #555756; color: var(--color-white); border: none; border-radius: 6px; cursor: pointer;">Conectar Dispositivo</button>
          <button id="reset-conn-btn" style="padding: 6px 10px; font-size: 10px; background: var(--color-overlay-white-border); color: var(--color-text-secondary); border: none; border-radius: 6px; cursor: pointer;" title="Restaurar conexão padrão com o aplicativo local (127.0.0.1)">Reset</button>
        </div>
        <div id="send-result" style="font-size: 11px; margin-top: 6px; color: var(--color-text-success);"></div>
      </div>
    </section>

    <div class="heading"><span>Canais</span><span id="count"></span></div>
    <div id="channels" class="channels"></div>
    <div class="heading"><span>Mensagens e Mídias</span><span id="links-count"></span></div>
    <div id="cards" class="cards"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
