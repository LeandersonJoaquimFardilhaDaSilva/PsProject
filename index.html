<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Flow — Links, Textos e Imagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(event) {
        console.error('Flow runtime error:', event.error || event.message);
        var errDiv = document.getElementById('flow-fatal-error');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'flow-fatal-error';
          errDiv.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;color:#ff5f57;padding:24px;z-index:999999;font-family:sans-serif;font-size:13px;overflow:auto;';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML = '<h3 style="color:#ff5f57;margin-top:0;">Falha ao carregar o aplicativo</h3><p style="color:#ddd;">' + (event.message || 'Erro inesperado') + '</p><pre style="color:#888;white-space:pre-wrap;font-size:11px;">' + (event.error ? event.error.stack : '') + '</pre>';
      });
    </script>
  </head>
  <body class="bg-[#0a0a0f] text-white select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
